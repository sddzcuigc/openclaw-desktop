name: Build OfflineCodex Full v3

on:
  pull_request:
    branches: [main]
    paths:
      - 'offline-codex-builder-v3/**'
      - '.github/workflows/build-offline-codex-full-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Reconstruct builder
        shell: pwsh
        run: |
          $p=Get-ChildItem 'offline-codex-builder-v3/parts/part-*.txt'|Sort-Object Name
          if($p.Count-ne 6){throw "Expected 6 parts"}
          $b=[string]::Concat(($p|%{(Get-Content $_.FullName -Raw).Trim()}))
          [IO.File]::WriteAllBytes('offline-codex-builder-v3/build.ps1',[Convert]::FromBase64String($b))

      - name: Build and self-test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          try{& ./offline-codex-builder-v3/build.ps1 *>&1|Tee-Object build.log}catch{$_|Out-String|Tee-Object build.log -Append;Get-Content build.log -Tail 120;throw}

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OfflineCodex-build-diagnostics
          path: |
            build.log
            offline-codex-builder-v3/build.ps1
          retention-days: 3

      - name: Split verified package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$s='split';New-Item $s -ItemType Directory -Force|Out-Null
          $base=Join-Path $s 'OfflineCodex-Full-v1.0.0-win-x64.zip'
          $seven=Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          &$seven a -tzip -mx=0 -v480m $base 'out/OfflineCodex-Full-v1.0.0-win-x64/*'
          if($LASTEXITCODE){throw "7-Zip failed: $LASTEXITCODE"}
          $i=1;Get-ChildItem "$base.*"|Sort-Object Name|%{Rename-Item $_.FullName ("OfflineCodex-Full-v1.0.0-win-x64.zip.part{0:d3}"-f $i);$i++}
          $info=Get-ChildItem "$s/*.part*"|Sort-Object Name|%{[ordered]@{name=$_.Name;size=$_.Length;sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()}}
          if($info.Count-ne 8){throw "Expected 8 split files, got $($info.Count)"}
          [ordered]@{archive='OfflineCodex-Full-v1.0.0-win-x64.zip';parts=@($info)}|ConvertTo-Json -Depth 5|Set-Content "$s/SPLIT-MANIFEST.json" -Encoding UTF8
          @'
          $ErrorActionPreference='Stop';$R=$PSScriptRoot;$m=Get-Content "$R/SPLIT-MANIFEST.json" -Raw|ConvertFrom-Json;$a=Join-Path $R $m.archive;$o=[IO.File]::Create($a)
          try{foreach($p in $m.parts){$f=Join-Path $R $p.name;if(!(Test-Path $f)){throw "Missing $($p.name)"};if((Get-FileHash $f -Algorithm SHA256).Hash.ToLower()-ne$p.sha256){throw "Checksum failed: $($p.name)"};$x=[IO.File]::OpenRead($f);try{$x.CopyTo($o)}finally{$x.Dispose()}}}finally{$o.Dispose()}
          Expand-Archive $a $R -Force;Write-Host '[PASS] OfflineCodex assembled and extracted.'
          '@|Set-Content "$s/ASSEMBLE-OfflineCodex.ps1" -Encoding UTF8
          '@echo off
          chcp 65001>nul
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0ASSEMBLE-OfflineCodex.ps1"
          pause'|Set-Content "$s/ASSEMBLE-OfflineCodex.cmd" -Encoding ASCII
          1..8|%{$n="part{0:d2}"-f $_;$d=Join-Path 'uploads' $n;New-Item $d -ItemType Directory -Force|Out-Null;Copy-Item "$s/OfflineCodex-Full-v1.0.0-win-x64.zip.part$($_.ToString('000'))" $d;Copy-Item "$s/ASSEMBLE-OfflineCodex.ps1","$s/ASSEMBLE-OfflineCodex.cmd","$s/SPLIT-MANIFEST.json" $d}

      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: OfflineCodex-Full-part01
          path: uploads/part01
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: OfflineCodex-Full-part02
          path: uploads/part02
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: OfflineCodex-Full-part03
          path: uploads/part03
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with:
          name: OfflineCodex-Full-part04
          path: uploads/part04
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Upload part 05
        uses: actions/upload-artifact@v4
        with:
          name: OfflineCodex-Full-part05
          path: uploads/part05
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Upload part 06
        uses: actions/upload-artifact@v4
        with:
          name: OfflineCodex-Full-part06
          path: uploads/part06
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Upload part 07
        uses: actions/upload-artifact@v4
        with:
          name: OfflineCodex-Full-part07
          path: uploads/part07
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Upload part 08
        uses: actions/upload-artifact@v4
        with:
          name: OfflineCodex-Full-part08
          path: uploads/part08
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
